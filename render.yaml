services:
  - type: web
    name: ecoclean-api
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: ecoclean-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: FRONTEND_URL
        value: https://ecoclean-web.onrender.com
      - key: DEEPSEEK_API_KEY
        sync: false

  - type: web
    name: ecoclean-web
    runtime: docker
    plan: free
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    envVars:
      - key: API_URL
        value: https://ecoclean-api.onrender.com/api

databases:
  - name: ecoclean-db
    plan: free
